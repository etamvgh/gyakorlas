<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Átirányítás – nyitott mondatok szorzással (maradékos)</title>
<!--
  Ez a gyakorlás a közös matek/nyitott/nyitott.html oldal "xmod" változata,
  amelyet URL paraméter választ ki (itt: valtozat=xmod).
  Ez a fájl csak átirányít, hogy saját címen is elérhető legyen.
-->
<style>
    body {
        font-family: system-ui, Arial, sans-serif;
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #f0f0f0;
        color: #444;
        text-align: center;
        padding: 20px;
    }
    a { color: #4a6cff; }
</style>
<script>
(function () {
    var VARIANT = 'xmod';                 // ehhez a fájlhoz tartozó változat
    var TARGET = '../nyitott/nyitott.html';
    // A meglévő paraméterek (embed, count, id, token, ...) megmaradnak.
    var params = new URLSearchParams(location.search);
    params.set('valtozat', VARIANT);
    location.replace(TARGET + '?' + params.toString() + location.hash);
})();
</script>
</head>
<body>
    <p>
        Ez a gyakorlás itt található:
        <a id="link" href="../nyitott/nyitott.html?valtozat=xmod">Nyitott mondatok szorzással (maradékos)</a>
    </p>
</body>
</html>
