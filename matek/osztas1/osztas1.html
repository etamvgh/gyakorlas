<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Átirányítás – osztás</title>
<!--
  Ez a gyakorlás átkerült a közös matek/alapmuveletek/alapmuveletek.html
  oldalra, ahol a műveletet URL paraméter választja ki (itt: op=div).
  Ez a fájl csak átirányít, hogy a régi hivatkozások is működjenek.
-->
<style>
    body {
        font-family: system-ui, Arial, sans-serif;
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #f0f0f0;
        color: #444;
        text-align: center;
        padding: 20px;
    }
    a { color: #4a6cff; }
</style>
<script>
(function () {
    var OP = 'div';                       // ehhez a fájlhoz tartozó művelet
    var TARGET = '../alapmuveletek/alapmuveletek.html';
    // A meglévő paraméterek (embed, count, id, token, ...) megmaradnak.
    var params = new URLSearchParams(location.search);
    params.set('op', OP);
    location.replace(TARGET + '?' + params.toString() + location.hash);
})();
</script>
</head>
<body>
    <p>
        Ez a gyakorlás átkerült ide:
        <a id="link" href="../alapmuveletek/alapmuveletek.html?op=div">Osztás</a>
    </p>
</body>
</html>
