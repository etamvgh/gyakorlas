<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Átirányítás – j / ly</title>
<!--
  Ez a gyakorlás átkerült a közös magyar/betuvalaszto/betuvalaszto.html
  oldalra, ahol a típust URL paraméter választja ki (itt: tipus=jly).
  A szólista továbbra is itt, a szavak.txt fájlban van.
  Ez a fájl csak átirányít, hogy a régi hivatkozások is működjenek.
-->
<style>
    body {
        font-family: system-ui, Arial, sans-serif;
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #f0f0f0;
        color: #444;
        text-align: center;
        padding: 20px;
    }
    a { color: #4a6cff; }
</style>
<script>
(function () {
    var TYPE = 'jly';                     // ehhez a fájlhoz tartozó típus
    var TARGET = '../betuvalaszto/betuvalaszto.html';
    // A meglévő paraméterek (embed, count, id, token, ...) megmaradnak.
    var params = new URLSearchParams(location.search);
    params.set('tipus', TYPE);
    location.replace(TARGET + '?' + params.toString() + location.hash);
})();
</script>
</head>
<body>
    <p>
        Ez a gyakorlás átkerült ide:
        <a id="link" href="../betuvalaszto/betuvalaszto.html?tipus=jly">j / ly</a>
    </p>
</body>
</html>
